name: canon_flutter
description: >-
  Flutter bindings for canon — router delegate, screen/entity scopes, and
  reactive view-state widgets over the pure-Dart canon runtime.
version: 0.6.0
repository: https://github.com/CardosoShlomo/canon_flutter
topics:
  - navigation
  - router
  - state-management
  - deep-linking
  - codegen

environment:
  sdk: ^3.10.0
  flutter: '>=3.35.0'

dependencies:
  canon: ^0.26.0
  canon_codec: ^0.3.0
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
